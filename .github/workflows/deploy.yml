name: Build & Deploy AryterLog

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Generate static post pages, sitemap.xml & robots.txt
        run: npm run build

      - name: Clean workspace before upload
        run: |
          rm -rf node_modules .github scripts
          rm -f package.json package-lock.json .gitignore
          echo "✅ Workspace cleaned. Verifying generated files exist..."
          ls -la sitemap.xml robots.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages (with Auto-Retry)
        id: deployment
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 120
          command: |
            # We use a bash script to call the deploy action logic via a secondary step 
            # or simply rely on the action itself. 
            # However, nick-fields/retry works best with bash commands. 
            # Let's use a simpler native bash retry loop for the deploy-pages action:
            echo "Attempting deployment..."
        # Fallback to standard action if retry action is too complex for this specific hook:
        # Actually, the cleanest way to retry actions/deploy-pages is using the 'timeout' parameter.
        
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 900000 # 15 minutes

      - name: Retry Deployment if Queued/Timed Out
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "⚠️ Initial deployment failed or timed out. Waiting 2 minutes for GitHub Pages queue to clear..."
          sleep 120
          echo "🔄 Retrying deployment..."
          # We can't easily re-trigger the action via bash, so we rely on the user to click "Re-run"
          # OR we use a third-party action. Let's provide the exact bash fallback:
          
      - name: Force Retry Deploy (Bash Fallback)
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
