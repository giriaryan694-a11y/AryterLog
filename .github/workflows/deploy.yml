name: Build & Deploy AryterLog

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Generate static post pages, sitemap.xml & robots.txt
        run: npm run build

      - name: "Clean workspace before upload (CRITICAL: Reduces artifact size)"
        run: |
          # Remove build tools and configs
          rm -rf node_modules .github scripts
          rm -f package.json package-lock.json .gitignore
          
          # CRITICAL FIX: Delete raw markdown source files.
          # Your live site only needs the generated HTML files (posts/<id>/index.html).
          # Raw .md files are bloating the artifact and causing the 10-minute timeout.
          find posts -type f -name "*.md" -delete
          
          echo "✅ Workspace cleaned. Verifying generated files exist..."
          ls -la sitemap.xml robots.txt
          
          # Print the final artifact size for diagnostics
          echo "📦 Final artifact size:"
          du -sh .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
