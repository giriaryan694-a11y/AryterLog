name: Build & Deploy AryterLog

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate static post pages, sitemap.xml & robots.txt
        run: npm run build

      - name: Clean workspace before upload (Fixes missing files & prevents source leaks)
        run: |
          # Remove heavy/unnecessary directories that cause upload timeouts or size limits
          rm -rf node_modules
          rm -rf .github
          rm -rf scripts
          
          # Remove config files not needed for the live site
          rm -f package.json package-lock.json .gitignore
          
          # Optional: Uncomment the line below if you want to hide your raw .md source files 
          # from being publicly accessible via direct URL (e.g., /posts/checkmate.md)
          # find posts -type f -name "*.md" -delete
          
          echo "✅ Workspace cleaned. Verifying generated files exist..."
          ls -la sitemap.xml robots.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
